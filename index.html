<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Miss Inquisitive</title>

    <style>
        /* 1. THE PAGE BACKGROUND */
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("IMG_1817.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Georgia, serif;
        }

        /* 2. THE THREE-COLUMN LAYOUT */
        .columns {
            margin-top: 0;
            display: grid;
            grid-template-columns: 2fr 1.25fr 1fr;
            gap: 18px;
            width: calc(100% - 48px);
            max-width: 1050px;
            margin: 40px auto;
            align-items: stretch;
        }

        /* 3. THE SHARED PAPER STYLE */
        .column {
            box-sizing: border-box;
            min-width: 0;
            min-height: 850px;
            padding: 24px;

            background-color: transparent;
            background-image: url("Firefly_RemoveBackground.png");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            border: none;
            colour: #38271F

            
        }

        /* 4. TEMPORARY LABELS FOR OUR TEST */
        .column h2 {
            text-align: center;
            font-size: 20px;
        }

        /* 5. SMALL-SCREEN LAYOUT */
        @media (max-width: 700px) {
            .columns {
                grid-template-columns: 1fr;
                width: calc(100% - 32px);
                margin: 24px auto;
                gap: 6px;
            }

            .column {
                min-height: 850px;
            }
        }
        
/* PUBLICATION MASTHEAD */
.masthead {
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid white;
    text-align: center;
    color: #FFFFFF;
    padding: 35px 16px 24px;
}

/* LARGE CURSIVE TITLE */
.masthead h1 {
    font-family: "Brush Script MT", "Segoe Script", cursive;
    font-size: clamp(48px, 8vw, 88px);
    font-weight: normal;
    line-height: 1.15;
    margin: 0 0 12px;
    color: #FFFFFF;
}

/* SMALL BLOCK LETTERS */
.masthead .tagline,
.masthead .ownership {
    font-family: Georgia, serif;
    font-size: 11px;
    letter-spacing: 3px;
    line-height: 1.8;
    margin: 5px 0;
    color: #FFFFFF;
    text-transform: uppercase;
}
        
/* The music widget itself */
.music-widget {
    box-sizing: border-box;
    width: 100%;
    max-width: 280px;
    margin: 0 auto;
    padding: 16px 12px;

    /* Replace this filename with your widget background */
    background-image: url("Firefly.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    color: #78564B;
    text-align: center;
}

/* Small, elegant heading */
.music-widget h2 {
    font-family: Georgia, serif;
    font-size: 16px;
    font-weight: normal;
    line-height: 1.4;
    color: #78564B;
    margin: 0 0 12px;
}

/* The violin photograph */
.listening-image {
    display: block;
    width: 100%;
    max-width: 145px;
    height: 115px;
    object-fit: cover;
    margin: 0 auto 12px;
}

/* Artist name */
.music-widget h3 {
    font-family: Georgia, serif;
    font-size: 16px;
    font-weight: normal;
    color: #49352D;
    margin: 0 0 4px;
}

/* Song title */
.song-title {
    font-family: Georgia, serif;
    font-size: 12px;
    font-style: italic;
    color: #78564B;
    margin: 0 0 12px;
}

/* Small label at the bottom */
.on-repeat {
    font-family: Georgia, serif;
    font-size: 9px;
    letter-spacing: 3px;
    color: #78564B;
    margin: 14px 0 0;
}

    </style>
</head>

<body>
    
<header class="masthead">
    <h1>Miss Inquisitive</h1>
    <p class="tagline">A LITTLE INTERNET PUBLICATION</p>
    <p class="ownership">PROPERTY OF MISS AYSHA</p>
</header>

    <main class="columns">

        <section class="column">
    
        </section>

        <section class="column">
            
        </section>

        
<section class="column listening">

    <div class="music-widget">

        <h2>Listening This Week</h2>

        <img
            src="IMG_1818.jpeg"
            alt="A violin"
            class="listening-image"
        >

        <h3>Lana Del Rey</h3>

        <p class="song-title">Blue Banisters</p>
        <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/album/2wwCc6fcyhp1tfY3J6Javr?utm_source=generator&si=59d96beba7e4469b" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

        <p class="on-repeat">ON REPEAT</p>

    </div>

</section>


    </main>

</body>
</html>
