
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miss Inquisitive</title>

    <style>
        /* BASIC PAGE SETTINGS */
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("IMG_1817.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        /* THREE-COLUMN LAYOUT */
        .columns {
            display: grid;
            grid-template-columns: 2fr 1.25fr 1fr
            gap: 18px;
            width: calc(100% - 48px);
            max-width: 1400px;
            margin: 40px auto;
            align-items: start;
        }
        /* INDIVIDUAL PAPER COLUMNS */
        .column {
            min-width: 0;
            min-height: 700px;
            padding: 24px;
            box-sizing: border-box;
            background-image: IMG_1823.jpeg;
            background-size: 100% 100%;
            background-position: centre;
        }
        /* SMALLER SCREENS */
        @media (max-width: 700px) {
            .columns {
                grid-template-columns: 1fr;
                width: calc(100% - 32px);
                gap: 16px;
                margin: 24px auto;
            }

            .column {
                min-height: 400px;
            }
    </style>
</head>

<body>
    <main class="columns">

        <section class="column left">
            <!-- Your largest paper column -->
        </section>

        <section class="column middle">
            <!-- Your medium paper column -->
        </section>

        <section class="column right">
            <!-- Your narrowest paper column -->
        </section>
</body>
</html>
