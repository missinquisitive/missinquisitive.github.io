
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Miss Inquisitive</title>

    <style>
        /* 1. THE PAGE BACKGROUND */
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #302019;
            background-image: url("image_1817.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Georgia, serif;
        }

        /* 2. THE THREE-COLUMN LAYOUT */
        .columns {
            display: grid;
            grid-template-columns: 2fr 1.25fr 1fr;
            gap: 18px;
            width: calc(100% - 48px);
            max-width: 1400px;
            margin: 40px auto;
            align-items: stretch;
        }

        /* 3. THE SHARED PAPER STYLE */
        .column {
            box-sizing: border-box;
            min-width: 0;
            min-height: 700px;
            padding: 24px;

            background-color: #E9DCC2;
            background-image: url("image_1823.jpeg");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;

            border: 2px solid white;
            color: #38271F;
        }

        /* 4. TEMPORARY LABELS FOR OUR TEST */
        .column h2 {
            text-align: center;
            font-size: 20px;
        }

        /* 5. SMALL-SCREEN LAYOUT */
        @media (max-width: 700px) {
            .columns {
                grid-template-columns: 1fr;
                width: calc(100% - 32px);
                margin: 24px auto;
                gap: 16px;
            }

            .column {
                min-height: 400px;
            }
        }
    </style>
</head>

<body>

    <main class="columns">

        <section class="column">
            <h2>LEFT COLUMN</h2>
        </section>

        <section class="column">
            <h2>MIDDLE COLUMN</h2>
        </section>

        <section class="column">
            <h2>RIGHT COLUMN</h2>
        </section>

    </main>

</body>
</html>
