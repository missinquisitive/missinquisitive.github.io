<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Miss Inquisitive</title>

    <style>
        /* 1. THE PAGE BACKGROUND */
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #302019;
            background-image: url("IMG_1817.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Georgia, serif;
        }

        /* 2. THE THREE-COLUMN LAYOUT */
        .columns {
            display: grid;
            grid-template-columns: 2fr 1.25fr 1fr;
            gap: 18px;
            width: calc(100% - 48px);
            max-width: 1050px;
            margin: 40px auto;
            align-items: stretch;
        }

        /* 3. THE SHARED PAPER STYLE */
        .column {
            box-sizing: border-box;
            min-width: 0;
            min-height: 700px;
            padding: 24px;

            background-color: #E9DCC2;
            background-image: url("Firefly.png");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;

            
        }

        /* 4. TEMPORARY LABELS FOR OUR TEST */
        .column h2 {
            text-align: center;
            font-size: 20px;
        }

        /* 5. SMALL-SCREEN LAYOUT */
        @media (max-width: 700px) {
            .columns {
                grid-template-columns: 1fr;
                width: calc(100% - 32px);
                margin: 24px auto;
                gap: 16px;
            }

            .column {
                min-height: 400px;
            }
        }
        
/* PUBLICATION MASTHEAD */
.masthead {
    text-align: center;
    color: #FFFFFF;
    padding: 35px 16px 24px;
}

/* LARGE CURSIVE TITLE */
.masthead h1 {
    font-family: "Brush Script MT", "Segoe Script", cursive;
    font-size: clamp(48px, 8vw, 88px);
    font-weight: normal;
    line-height: 1.15;
    margin: 0 0 12px;
    color: #FFFFFF;
}

/* SMALL BLOCK LETTERS */
.masthead .tagline,
.masthead .ownership {
    font-family: Georgia, serif;
    font-size: 11px;
    letter-spacing: 3px;
    line-height: 1.8;
    margin: 5px 0;
    color: #FFFFFF;
    text-transform: uppercase;
}
    </style>
</head>

<body>
    
<header class="masthead">
    <h1>Miss Inquisitive</h1>
    <p class="tagline">A LITTLE INTERNET PUBLICATION</p>
    <p class="ownership">PROPERTY OF MISS AYSHA</p>
</header>

    <main class="columns">

        <section class="column">
    
        </section>

        <section class="column">
            
        </section>

        <section class="column listening">
    <h2>Listening This Week</h2>

    <img
        src="IMG_1818.jpeg"
        alt="Violin"
        class="listening-image"
    >

    <h3>Lana Del Rey</h3>
</section>

    </main>

</body>
</html>
